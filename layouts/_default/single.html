{{ define "main" }}
<div class="page">
  {{ with .Params.archive_tab }}{{ partial "archive-tabs.html" $ }}{{ end }}
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.lead }}<p class="page-lead">{{ . }}</p>{{ end }}
  <div class="page-content">
    {{ .Content }}
  </div>
</div>
{{ end }}
