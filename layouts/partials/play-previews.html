<script>
  // Play each paper's preview clip (video.pub-preview) only while it is on
  // screen, and not at all for visitors who ask for reduced motion
  (function () {
    var clips = document.querySelectorAll('.pub-preview');
    if (!clips.length || !('IntersectionObserver' in window)) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.play().catch(function () {});
        else entry.target.pause();
      });
    }, { threshold: 0.25 });
    clips.forEach(function (clip) { observer.observe(clip); });
  })();
</script>
