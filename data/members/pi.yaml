name: "Maxim Likhachev"
title: "Professor"
photo: "/images/members/maxim-likhachev.jpg"
email: "maxim@cs.cmu.edu"
bio: >
  My general research interests lie in Artificial Intelligence and Robotics. 
  More specifically, my group studies such questions as high-dimensional planning in
  real-time, planning that "learns how to plan" based on experience, automatic
  generation of compact representation of planning problems, high-dimensional
  planning under uncertainty in real-time and others. Most of the group's
  approaches are centered around the development of new graph search
  algorithms for real-time planning on huge graphs, study of new graph search
  algorithms for learning how to search these graphs efficiently from
  experience and methods for learning compact graph representations of
  planning problems.
