# =============================================================================
# Alumni
# =============================================================================
# Members who have left the lab. The `category` field controls which section
# the entry appears under on /people/. The full set of recognised categories
# is:
#
#   postdoc          - Post-doctoral researcher (Postdoc Alumni)
#   phd              - PhD student          (PhD Alumni)
#   masters          - Masters student      (Masters Alumni)
#   undergraduate    - Undergraduate        (Undergrad Alumni)
#   research-staff   - Permanent research staff / engineer (Research Alumni)
#   collaborator     - Visiting researcher / external collaborator
#                      (Research Collaborators - Past)
#   intern           - Summer / short-term intern (Intern Alumni)
#
# When someone graduates or leaves, move their entry from current.yaml here,
# set the right category, and add `graduated:` (year) and/or `now_at:` if
# known.
#
# Entries below the "Legacy (sbpl.net, ~2012-2015)" marker were imported from
# the old Drupal sbpl.net site and reflect each member's role at the time of
# that snapshot. Career-history fields (`now_at`) are intentionally left
# blank where we don't have a verified public source - please update if you
# have better information.
# =============================================================================

