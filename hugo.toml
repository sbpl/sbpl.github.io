[params]
  description = "Search-Based Planning Lab at Carnegie Mellon University"
  labName = "SBPL"
  labFullName = "Search-Based Planning Lab"
  labLogo = "/images/lab-logo.png"
  labBlurb = "The Search-Based Planning Laboratory researches methodologies and algorithms that enable autonomous systems to act fast, intelligently, and robustly. Our research concentrates on developing novel planning approaches, novel heuristic searches, and investigating how planning can be combined with machine learning. Our work spans graph theory, algorithms, data structures, machine learning, and robotics. We use our algorithms to build real-time planners for complex robotic systems operating in the real world and performing challenging tasks ranging from autonomous navigation and autonomous flight to multi-agent systems and full-body mobile manipulation."
  university = "Carnegie Mellon University"
  department = "Robotics Institute"

